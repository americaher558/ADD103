<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Wall</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  </head>
  <body>
    <div class="hero">
      <div class="hero-text">
        <h1>Concert Photo Wall</h1>
        <p>
          This is a collage of some concerts I have attended the past few years!
        </p>
        <div class="button">
          <a href="#main" class="btn">View Wall</a>
        </div>
      </div>
      <div class="hero-img">
        <img src="images/arianagrande.jpg" alt="Ariana Grande Concert" />
      </div>
    </div>
    <main class="photo-wall" id="main">
      <div>
        <img src="images/charli.JPG" alt="Lollapalooza Charli XCX " />
      </div>
      <div><img src="images/dpr.jpg" alt="DPR Concert" /></div>
      <div>
        <img src="images/jhope.jpg" alt="Lollapalooza J-Hope performance" />
      </div>
      <div>
        <img src="images/metro.JPG" alt="Lollapalooza Metro and Future set" />
      </div>
      <div>
        <img src="images/nct.jpg" alt="NCT 127 Concert at United Center" />
      </div>
      <div>
        <img
          src="images/suga.JPG"
          alt="BTS SUGA first world tour at Allstate Arena"
        />
      </div>
      <div>
        <img
          src="images/summit.JPG"
          alt="John Summit Birthday set at Lollapalooza"
        />
      </div>
      <div><img src="images/bts1.jpg" alt="BTS Arirang Day 1" /></div>
      <div><img src="images/bts2.jpg" alt="BTS Arirang Day 2" /></div>
    </main>
    <footer>
      <p>Created by America Hernandez</p>
      <p><a href="../index.html">Home</a></p>
    </footer>
  </body>
</html>
